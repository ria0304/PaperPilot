name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Test with pytest
        run: python -m pytest backend/tests/ -v

  frontend:
    name: Frontend (Vite/Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint with ESLint
        run: npx eslint .
      - name: Format with Prettier
        run: npx prettier --check .
      - name: Test with Vitest
        run: npx vitest run

  build:
    name: Build & Check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Check backend can serve
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -c "from fastapi.staticfiles import StaticFiles; print('StaticFiles OK')"