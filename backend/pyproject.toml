[tool.ruff]
line-length = 88
target-version = "py310"

exclude = [
    "node_modules",
    ".venv",
    "__pycache__",
    ".git",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "TID", "UP", "ANN", "PLR"]
ignore = [
    "E501",     
    "PLR2004",  
    "PLR0911",  
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
